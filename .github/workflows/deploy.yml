Final Dockerfile (production-ready)
FROM python:3.11-slim-bookworm AS base

ENV PYTHONDONTWRITEBYTECODE=1 \
    PYTHONUNBUFFERED=1 \
    PIP_NO_CACHE_DIR=1

RUN apt-get update && apt-get install -y --no-install-recommends \
    build-essential curl sqlite3 postgresql-client \
    && rm -rf /var/lib/apt/lists/*

WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

COPY app ./app
COPY alembic ./alembic
COPY alembic.ini ./alembic.ini
COPY scripts ./scripts
RUN mkdir -p /app/data

EXPOSE 8080
HEALTHCHECK --interval=30s --timeout=5s --start-period=15s --retries=3 \
    CMD curl -fsS http://localhost:8080/healthz || exit 1

# Use gunicorn + uvicorn workers in production
CMD ["gunicorn", "app.main:app", \
     "-k", "uvicorn.workers.UvicornWorker", \
     "-w", "4", \
     "-b", "0.0.0.0:8080", \
     "--timeout", "120", \
     "--access-logfile", "-", \
     "--error-logfile", "-"]
Quick start commands
# 1. Apply DB migrations (instead of auto-create)
alembic upgrade head

# 2. Start the app
docker compose up -d

# 3. Bootstrap superadmin
curl -X POST "http://localhost:8080/admin/auth/register?email=you@co.com&password=ChangeMe123!&is_superadmin=true" \
  -H "X-Admin-Key: $ADMIN_API_KEY"

# 4. Sign in via dashboard
open http://localhost:8080/dashboard/login

# 5. Enable 2FA
curl -X POST http://localhost:8080/admin/auth/2fa/enable \
  -H "Cookie: dg_session=..." -H "X-Admin-Key: $ADMIN_API_KEY"
# Scan the QR, then verify with a code:
curl -X POST "http://localhost:8080/admin/auth/2fa/disable?code=123456" \
  -H "Cookie: dg_session=..." -H "X-Admin-Key: $ADMIN_API_KEY"

# 6. Deploy to Kubernetes
helm upgrade --install dyergate ./deploy/helm \
  --set image.tag=$(git describe --tags) \
  --set secrets.SECRET_KEY=$(openssl rand -hex 32) \
  --set secrets.ADMIN_API_KEY=$(openssl rand -hex 32) \
  --set secrets.STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY \
  --set secrets.STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET

# 7. Backup cron
0 */6 * * * /opt/dyergate/scripts/backup.sh
