name: Deploy
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
      - name: Apply manifests
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kc
          KUBECONFIG=/tmp/kc kubectl set image deployment/dyergate \
            dyergate=ghcr.io/${{ github.repository }}:${{ github.ref_name }} -n dyergate
deploy/helm/Chart.yaml
apiVersion: v2
name: dyergate
description: Sovereign metered LLM gateway
type: application
version: 3.1.0
appVersion: "3.1.0"
deploy/helm/values.yaml
replicaCount: 2
image:
  repository: ghcr.io/yourorg/dyergate
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.your-domain.com
      paths: [{path: /, pathType: Prefix}]
  tls:
    - hosts: [api.your-domain.com]
      secretName: dyergate-tls
resources:
  requests: {cpu: 500m, memory: 512Mi}
  limits: {cpu: 2000m, memory: 2Gi}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
env:
  DATABASE_URL: "postgres+psycopg://dyergate:secret@postgres/dyergate"
  REDIS_URL: "redis://redis:6379/0"
  UPSTREAM_PROVIDER: "ollama"
  UPSTREAM_API_URL: "http://ollama:11434"
secrets:
  SECRET_KEY: ""
  ADMIN_API_KEY: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  RESEND_API_KEY: ""
persistence:
  enabled: true
  size: 20Gi
deploy/helm/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dyergate
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: dyergate}
  template:
    metadata:
      labels: {app: dyergate}
    spec:
      containers:
        - name: dyergate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{containerPort: 8080}]
          env:
            - name: DATABASE_URL
              value: {{ .Values.env.DATABASE_URL | quote }}
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL | quote }}
            - name: UPSTREAM_PROVIDER
              value: {{ .Values.env.UPSTREAM_PROVIDER | quote }}
            - name: UPSTREAM_API_URL
              value: {{ .Values.env.UPSTREAM_API_URL | quote }}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: dyergate-secrets, key: secret-key}}
            - name: ADMIN_API_KEY
              valueFrom: {secretKeyRef: {name: dyergate-secrets, key: admin-key}}
            - name: STRIPE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: dyergate-secrets, key: stripe-secret}}
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: dyergate-secrets, key: stripe-webhook}}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{ toYaml .Values.resources | nindent 12 }}
deploy/helm/templates/ingress.yaml
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dyergate
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ (index .Values.ingress.hosts 0).host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: dyergate, port: {number: {{ .Values.service.port }}}}}
  tls:
    - hosts: {{ .Values.ingress.tls[0].hosts | toJson }}
      secretName: {{ .Values.ingress.tls[0].secretName }}
{{- end }}
deploy/helm/templates/hpa.yaml
{{- if .Values.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: dyergate}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: dyergate}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}}}
{{- end }}
deploy/helm/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata: {name: dyergate-secrets}
type: Opaque
stringData:
  secret-key: {{ .Values.secrets.SECRET_KEY | quote }}
  admin-key: {{ .Values.secrets.ADMIN_API_KEY | quote }}
  stripe-secret: {{ .Values.secrets.STRIPE_SECRET_KEY | quote }}
  stripe-webhook: {{ .Values.secrets.STRIPE_WEBHOOK_SECRET | quote }}
  resend-api-key: {{ .Values.secrets.RESEND_API_KEY | quote }}
deploy/helm/templates/service.yaml
apiVersion: v1
kind: Service
metadata: {name: dyergate}
spec:
  type: {{ .Values.service.type }}
  selector: {app: dyergate}
