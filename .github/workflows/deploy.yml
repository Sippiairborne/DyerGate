Phase 7: DyerGate Cloud — Managed Multi-Tenant SaaS Mode
This phase turns DyerGate from a deployable product into a SaaS platform where you host the gateway for end-customers. Includes:

Stripe Connect (Express) — marketplace model: customers pay you, you take a platform fee, optionally pass through to resellers.
Per-tenant subdomain routing — acme.dyergate.cloud → that org's gateway.
Custom domain support — customers bring their own domain with auto-TLS.
Customer self-service signup — public landing → org creation → first API key, no admin intervention.
Usage-based + subscription hybrid billing — Stripe Subscriptions for tier base fee + metered usage for overage.
Terraform module for AWS — production-grade IaC (ECS Fargate, RDS, ElastiCache, ALB, Route53, ACM, S3, SES).
Customer-facing docs site — Mintlify-compatible markdown structure.
Status page + incident log — /status JSON endpoint with per-component health.
Multi-region failover — primary/secondary DNS with health-checked failover.
