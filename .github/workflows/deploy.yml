What you ship in v3.1.0
A production-grade, multi-tenant, RBAC-protected, GDPR-compliant, Kubernetes-deployable, observability-instrumented, CI/CD-automated, test-covered metered AI gateway that:

Bills customers accurately per token with reserve/refund.
Accepts payments via Stripe with auto top-up.
Streams OpenAI-compatible responses.
Tracks usage in an immutable ledger with scheduled reports.
Archives cold data to S3.
Enforces per-org quotas, per-tier rate limits, per-IP allowlists.
Supports 2FA admin login and full audit trail.
Exposes Prometheus metrics and readiness probes.
Deploys via Helm with auto-scaling.
Backs up automatically with verified restores.
