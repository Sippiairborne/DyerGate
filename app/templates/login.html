<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DyerGate Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0b1020;color:#e2e8f0;}</style>
</head>
<body class="flex items-center justify-center h-screen">
<div class="card bg-[#131a2b] border border-[#1f2a44] rounded-xl p-8 w-96">
  <h1 class="text-xl font-semibold mb-4">⚡ DyerGate Admin Login</h1>
  <form id="f" class="flex flex-col gap-3">
    <input id="email" class="bg-[#0b1020] border border-[#1f2a44] rounded p-2" placeholder="Email">
    <input id="password" type="password" class="bg-[#0b1020] border border-[#1f2a44] rounded p-2" placeholder="Password">
    <button class="bg-indigo-600 hover:bg-indigo-500 rounded p-2">Sign in</button>
  </form>
  <div id="err" class="text-rose-400 mt-2 text-sm"></div>
</div>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch('/admin/auth/login?email=' + encodeURIComponent(email.value) + '&password=' + encodeURIComponent(password.value), {method:'POST'});
  if (r.ok) location.href = '/dashboard';
  else document.getElementById('err').textContent = (await r.json()).detail || 'Login failed';
};
</script>
</body>
</html>
